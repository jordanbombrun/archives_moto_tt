{% include "nav.html" %}

<h1>Liste des championnats</h1>

<table border="1">
    <thead>
        <tr>
            <th>Nom du championnat</th>
            <th>Année</th>
            <th>Voir les courses</th>
        </tr>
    </thead>
    <tbody>
        {% for serie in series %}
        <tr>
            <td>{{ serie.name }}</td>
            <td>{{ serie.year }}</td>
            <td>
                <a href="{{ url_for('render_list_races_for_serie', serie_id=serie.db_id) }}">
                    Voir les courses
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
